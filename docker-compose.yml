services:
  blog:
    build: .
    image: fastapi-blog:3.11-bookworm
    container_name: app.blog
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_PORT: "8000"
      APP_RELOAD: "true"
    volumes:
      - ./app:/app/app
      - ./db:/app/db
      - ./main.py:/app/main.py
      - ./run.py:/app/run.py
