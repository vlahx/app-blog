{# Minimal theme: footer #}
<footer class="footer mt-auto border-top" style="background: transparent;">
  <div class="container-fluid px-4 py-4">
    <div class="row align-items-center">
      <div class="col-md-6">
        <p class="text-secondary mb-0">
          <strong class="text-body">{{ site_display_name() }}</strong> — {{ site_tagline() }}
        </p>
      </div>
      <div class="col-md-6 text-md-end">
        {% set _t = active_theme_info() %}
        <small class="text-secondary">{{ t("footer.theme") }}: <strong>{{ _t.name|e }}</strong> • {{ _t.author|e }} • {{ now().strftime("%Y") }}</small>
      </div>
    </div>
  </div>
</footer>
